<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680">
  <defs>
    <linearGradient id="claudeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#C4956A"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect width="1050" height="680" rx="24" ry="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#roundedClip)">
    <rect width="1050" height="680" fill="url(#claudeBg)"/>
    <!-- Claude Sparkle Icon - официальный стиль -->
    <g transform="translate(525, 340)">
      <!-- Центральная точка -->
      <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
      <!-- Основные лучи (вертикальные и горизонтальные) -->
      <path d="M0 -30 Q0 -60 0 -90" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M0 30 Q0 60 0 90" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M-30 0 Q-60 0 -90 0" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M30 0 Q60 0 90 0" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- Диагональные лучи -->
      <path d="M-21 -21 Q-42 -42 -63 -63" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M21 -21 Q42 -42 63 -63" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M-21 21 Q-42 42 -63 63" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M21 21 Q42 42 63 63" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="claudeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#C4956A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#claudeBg)"/>
  <!-- Claude Sparkle Icon -->
  <g transform="translate(200, 150)">
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    <!-- Rays -->
    <line x1="0" y1="-20" x2="0" y2="-55" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="55" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="-55" y2="0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="55" y2="0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Diagonal rays -->
    <line x1="-14" y1="-14" x2="-38" y2="-38" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="14" y1="-14" x2="38" y2="-38" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="-14" y1="14" x2="-38" y2="38" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="38" y2="38" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>

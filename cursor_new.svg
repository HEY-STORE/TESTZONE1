<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680">
  <defs>
    <linearGradient id="cursorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <clipPath id="roundedClip2">
      <rect width="1050" height="680" rx="24" ry="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#roundedClip2)">
    <rect width="1050" height="680" fill="url(#cursorBg)"/>
    <!-- Cursor 3D Cube Icon -->
    <g transform="translate(525, 340) scale(1.8)">
      <!-- Верхняя грань -->
      <polygon points="0,-60 70,-30 0,0 -70,-30" fill="#B0B0B0"/>
      <!-- Левая грань -->
      <polygon points="-70,-30 0,0 0,60 -70,30" fill="#808080"/>
      <!-- Правая грань -->
      <polygon points="70,-30 0,0 0,60 70,30" fill="#606060"/>
    </g>
  </g>
</svg>
